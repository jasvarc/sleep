# Appka "sleep" - pridaj tieto dva riadky DOVNUTRA KAZDEHO <VirtualHost ...>
# bloku, cez ktory ma byt appka dostupna (typicky <VirtualHost *:80> aj
# <VirtualHost *:443> v tvojom existujucom site configu, napr.
# /etc/apache2/sites-enabled/000-default.conf a/alebo *-le-ssl.conf),
# pred zatvarajuci tag </VirtualHost>.
#
# Ak tvoj port 80 vhost robi len redirect na https (Redirect permanent / https://...),
# staci tieto riadky pridat len do :443 vhostu.
#
# Vyzaduje moduly proxy a proxy_http (rovnake ako pre appky rozpravky a
# text_piesne - ak uz su povolene, tento krok preskoc):
#   sudo a2enmod proxy proxy_http
#   sudo systemctl restart apache2
#
# Node appka pocuva iba na 127.0.0.1:3002 (nie je dostupna zvonka priamo,
# len cez tento Apache reverse proxy na portoch 80/443).

ProxyPass /sleep/ http://127.0.0.1:3002/
ProxyPassReverse /sleep/ http://127.0.0.1:3002/
